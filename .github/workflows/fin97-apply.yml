name: FIN-001 Apply
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'agent/product-hardening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false
      - run: python3 .github/agent/fin97_fix.py
      - run: rm .github/agent/fin97_fix.py .github/workflows/fin97-apply.yml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check --write .
      - run: pnpm build
      - run: pnpm test
      - name: Commit validated FIN-001
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(cloud): finish authoritative lifecycle integration'
          git push origin HEAD:agent/product-hardening
