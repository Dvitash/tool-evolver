name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnose-unit:
    name: FIN-003 Unit Regression Diagnostic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Capture compact unit failure report
        shell: bash
        run: |
          set +e
          pnpm test --reporter=verbose > unit-full.log 2>&1
          status=$?
          grep -E -B 2 -A 8 'FAIL |Failed Tests|AssertionError|TypeError|Error:|Test Files|Tests ' unit-full.log > unit-failures.txt || true
          tail -n 120 unit-full.log >> unit-failures.txt
          echo "test_exit=$status" >> unit-failures.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fin003-unit-failure
          path: unit-failures.txt
          if-no-files-found: error
