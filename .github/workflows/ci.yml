name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-fin99-test:
    name: FIN-003 Format Acceptance Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check --write apps/cli/tests/installer/packaged-cli-production-http.test.ts
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/cli/tests/installer/packaged-cli-production-http.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(installer): format packaged CLI acceptance test'
          git push origin HEAD:agent/product-hardening