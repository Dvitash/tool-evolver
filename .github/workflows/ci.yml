name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  fin99-acceptance:
    name: FIN-003 Signed Installer Acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec vitest run apps/cli/tests/assets.test.ts apps/cli/tests/installer/signed-channel-verifier.test.ts apps/cli/tests/installer/npm-pack-clean-install.test.ts apps/cli/tests/installer/production-release-transaction.test.ts apps/cli/tests/installer/packaged-cli-production-http.test.ts apps/cli/tests/installer-e2e.test.ts apps/cli/tests/upgrade-command.test.ts scripts/verify-release.test.mjs
