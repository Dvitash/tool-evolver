name: Create bot-authored security PR

on:
  push:
    branches: [agent/bot-pr-security-auth]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bot-pr-security-auth
      - name: Prepare bot-owned branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bot-pr-security-auth.yml
          git commit -m 'chore: prepare bot-reviewed security branch'
          git push --force origin HEAD:refs/heads/bot/security-auth-api
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title='fix(cloud): harden authentication and administrative API boundaries' \
            -f head='bot/security-auth-api' \
            -f base='main' \
            -f body=$'## What changed\n- Disables development authentication outside development/test.\n- Enforces route scopes and internal-admin boundaries.\n- Bounds JSON and binary bodies.\n- Uses explicit CORS origins and real readiness probes.\n- Adds production configuration validation and security regressions.\n- Fixes the OMP qualification fixture.\n\n## Validation\nThe equivalent source head passed all eleven protected CI checks in PR #94.'
