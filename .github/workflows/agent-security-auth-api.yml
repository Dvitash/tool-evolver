name: Agent Security Auth API Patcher

on:
  push:
    branches: [agent/security-auth-api]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'agent/security-auth-api' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/security-auth-api')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false
      - name: Apply security hardening patch
        run: python3 .github/agent/security_auth_api.py
      - name: Align least-privilege route scopes and fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          api = Path("apps/cloud/src/server/api.ts")
          text = api.read_text()
          text, count = re.subn(
              r'(if \(path === "/v1/devices"\) \{\s*)assertRequestScope\(authContext, "admin:all"\);',
              r'\1assertRequestScope(authContext, "device:connect");',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("device scope marker not found")
          api.write_text(text)

          isolation = Path("apps/cloud/tests/auth/isolation.test.ts")
          text = isolation.read_text()
          marker = 'scopes: ["device:connect", "artifacts:read"],'
          if text.count(marker) != 2:
              raise SystemExit("isolation scope markers not found")
          isolation.write_text(text.replace(
              marker,
              'scopes: ["device:connect", "artifacts:read", "deployments:write"],',
          ))
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm exec biome check --write apps/cloud/src/config.ts apps/cloud/src/server/api.ts apps/cloud/src/server/security.ts apps/cloud/src/auth/middleware.ts apps/cloud/tests/security-hardening.test.ts apps/cloud/tests/auth/isolation.test.ts adapters/omp/tests/qualification.test.ts
      - name: Build
        run: pnpm build
      - name: Run focused tests
        run: pnpm vitest run apps/cloud/tests/config.test.ts apps/cloud/tests/server.test.ts apps/cloud/tests/security-hardening.test.ts apps/cloud/tests/auth adapters/omp/tests/qualification.test.ts
      - name: Commit patched sources
        run: |
          git config user.name "tool-evolver-agent"
          git config user.email "tool-evolver-agent@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): harden cloud authentication and admin APIs"
          git push origin HEAD:agent/security-auth-api
