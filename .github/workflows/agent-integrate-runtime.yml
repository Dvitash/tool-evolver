name: Integrate Runtime Hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/finished-product'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/finished-product
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.24.0
          run_install: false
      - name: Configure git identity
        run: |
          git config user.name "tool-evolver-agent"
          git config user.email "tool-evolver-agent@users.noreply.github.com"
      - name: Apply validated Runtime commit
        run: git cherry-pick e2d2339ced0bb90334e2009dc8f5fbd39e00079c
      - name: Reconcile tests and injectable certification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          doctor = Path("apps/cli/src/commands/doctor.ts")
          text = doctor.read_text()
          start = text.index("export async function doctorCommand(")
          end = text.index("export async function repairCommand(", start)
          segment = text[start:end]
          segment, count = re.subn(
              r'(\s+isRepair\?: boolean;\n)',
              r'\1    safetyCertification?: LocalSafetyCertificationOptions;\n',
              segment,
              count=1,
          )
          if count != 1:
              raise SystemExit("doctorCommand options marker not found")
          segment, count = re.subn(
              r'(actionsTaken = await repairState\(\{[\s\S]*?customFetch: options\.customFetch,\n)(\s*\}\);)',
              r'\1        safetyCertification: options.safetyCertification,\n\2',
              segment,
              count=1,
          )
          if count != 1:
              raise SystemExit("repairState forwarding marker not found")
          text = text[:start] + segment + text[end:]

          start = text.index("export async function repairCommand(")
          segment = text[start:]
          segment, count = re.subn(
              r'(\s+customFetch\?: typeof fetch;\n)(\s*\} = \{\},)',
              r'\1    safetyCertification?: LocalSafetyCertificationOptions;\n\2',
              segment,
              count=1,
          )
          if count != 1:
              raise SystemExit("repairCommand options marker not found")
          text = text[:start] + segment
          doctor.write_text(text)

          doctor_test = Path("apps/cli/tests/doctor-repair-command.test.ts")
          text = doctor_test.read_text()
          text, count = re.subn(
              r'(const actions = await repairState\(\{\s*home: homeDir,\s*fsBridge,)(\s*\}\);)',
              r'\1\n      safetyCertification: {\n        probeOverrides: { denoAvailable: true, denoVersion: "2.0.0" },\n      },\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("direct repairState test marker not found")
          text, count = re.subn(
              r'(const exitCode = await repairCommand\(\["--json", "--home", homeDir\], \{\s*fsBridge,)(\s*\}\);)',
              r'\1\n        safetyCertification: {\n          probeOverrides: { denoAvailable: true, denoVersion: "2.0.0" },\n        },\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("repairCommand test marker not found")
          doctor_test.write_text(text)

          mediation = Path("packages/runtime/tests/brokers/secret-mediation.test.ts")
          text = mediation.read_text()
          pattern = r'''      // Dispatched request for mediateHeaders[\s\S]*?      // Dispatched direct read fails\n      await expect\(\n        brokerManager\.handleRequest\("secret", "getSecret", \{ name: "GITHUB_TOKEN" \}, ctx\),\n      \)\.rejects\.toThrow\(BrokerSecurityError\);'''
          replacement = '''      // Worker RPC cannot receive a fully mediated plaintext value.
      await expect(
        brokerManager.handleRequest(
          "secret",
          "mediateHeaders",
          {
            headers: {
              Authorization: "Bearer {{secret:GITHUB_TOKEN}}",
            },
          },
          ctx,
        ),
      ).rejects.toMatchObject({ code: "DIRECT_READ_DENIED" });

      // Trusted host brokers consume the secret without returning it to the worker.
      const trusted = await secretBroker.mediateHeaders(
        { Authorization: "Bearer {{secret:GITHUB_TOKEN}}" },
        { ...ctx, isWorker: false, source: "host" },
      );
      expect(trusted.Authorization).toBe(
        "Bearer ghp_123456789012345678901234567890123456",
      );

      await expect(
        brokerManager.handleRequest("secret", "getSecret", { name: "GITHUB_TOKEN" }, ctx),
      ).rejects.toThrow(BrokerSecurityError);'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("secret mediation test marker not found")
          mediation.write_text(text)
          PY
      - name: Remove temporary integration workflow
        run: rm .github/workflows/agent-integrate-runtime.yml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec biome check --write .
      - name: Build
        run: pnpm build
      - name: Run tests
        run: pnpm test
      - name: Commit integrated source
        run: |
          git add -A
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:agent/finished-product
